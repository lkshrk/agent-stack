---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsh-yawn
configMapGenerator:
  - name: dsh-yawn-agent-config
    files:
      - mcp-servers.yaml
      - models.yaml
      - openviking-preferences.json
      - openviking-row.yaml
      - superagent.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
