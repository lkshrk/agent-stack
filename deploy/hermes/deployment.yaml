apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        h-cloud.io/signal-client: hermes
    spec:
      serviceAccountName: hermes
      initContainers:
        - name: seed
          image: ghcr.io/lkshrk/agent-stack/hermes:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              install -d -o 10000 -g 10000 /opt/data
              [ -d /opt/data/knowledge/.git ] || su -s /bin/bash hermes -c 'git clone -q https://github.com/lkshrk/knowledge.git /opt/data/knowledge' || echo "vault clone failed; retried by Hermes later" >&2
              su -s /bin/bash hermes -c 'HERMES_HOME=/opt/data hermes plugins install openviking --yes' || echo "openviking plugin install failed" >&2
          envFrom:
            - secretRef:
                name: hermes-env
          env:
            - name: KNOWLEDGE_TOKEN_FILE
              value: /var/run/agent/github/knowledge
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /etc/hermes/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: github-tokens
              mountPath: /var/run/agent/github
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/lkshrk/agent-stack/hermes:latest
          args: ["gateway", "run"]
          envFrom:
            - secretRef:
                name: hermes-env
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data
            - name: KNOWLEDGE_TOKEN_FILE
              value: /var/run/agent/github/knowledge
            - name: GH_TOKEN_FILE
              value: /var/run/agent/github/code
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /etc/hermes/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /opt/data/SOUL.md
              subPath: SOUL.md
              readOnly: true
            - name: github-tokens
              mountPath: /var/run/agent/github
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 4Gi}
        - name: snapshot
          image: ghcr.io/lkshrk/agent-stack/hermes:latest
          command: ["bash", "/config/snapshot.sh"]
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: GIT_AUTHOR_NAME
              value: hermes-snapshot
            - name: GIT_AUTHOR_EMAIL
              value: hermes-snapshot@localhost
            - name: GIT_COMMITTER_NAME
              value: hermes-snapshot
            - name: GIT_COMMITTER_EMAIL
              value: hermes-snapshot@localhost
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
        - name: github-tokens
          secret:
            secretName: agent-github-tokens
            defaultMode: 0440
