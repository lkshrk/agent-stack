apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-read
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - nodes
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - serviceaccounts
      - replicationcontrollers
      - resourcequotas
      - limitranges
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, storage.k8s.io, discovery.k8s.io, coordination.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - gateway.networking.k8s.io
      - gateway.envoyproxy.io
      - cert-manager.io
      - monitoring.coreos.com
      - postgresql.cnpg.io
      - ceph.rook.io
      - volsync.backube
      - cilium.io
      - kyverno.io
      - tuppr.home-operations.com
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-read
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
