apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml

configMapGenerator:
  - name: hermes-config
    files:
      - ../../config/hermes/config.yaml
      - ../../config/hermes/SOUL.md
      - ../../config/hermes/snapshot.sh
