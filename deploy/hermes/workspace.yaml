apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-workspace
  labels:
    app.kubernetes.io/name: hermes-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-workspace
    spec:
      automountServiceAccountToken: false
      containers:
        - name: workspace
          image: ghcr.io/outsourc-e/hermes-workspace:v2.1.3@sha256:49b434440f2bc02353f69da4b264814a972ec0bc63d7351fc05f2cf52ce057e7
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HERMES_API_URL
              value: http://hermes.hermes.svc.cluster.local:8642
            - name: HERMES_DASHBOARD_URL
              value: http://hermes.hermes.svc.cluster.local:9119
            - name: HERMES_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: API_SERVER_KEY
            - name: HERMES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-workspace
                  key: HERMES_PASSWORD
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 2560Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-workspace
      ports:
        - port: 8642
        - port: 9119
