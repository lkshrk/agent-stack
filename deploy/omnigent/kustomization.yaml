apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/omnigent-ai/omnigent//deploy/kubernetes/overlays/sandbox-runners?ref=v0.19.1
  - token-minter.yaml

images:
  - name: ghcr.io/omnigent-ai/omnigent-server-kubernetes
    newTag: v0.19.1@sha256:5746692f3c3a95502f76f83260c3e5ff36348ad8c3cdce1fab85784065e44dad

patches:
  - path: sandbox-config.yaml
  - target:
      kind: Ingress
      name: omnigent
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: omnigent
  - target:
      kind: Secret
      name: omnigent-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: omnigent-secrets
