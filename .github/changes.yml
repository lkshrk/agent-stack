# Read by dorny/paths-filter with predicate-quantifier: some-with-excludes, so a '!' pattern excludes from every filter that includes it.
ci: &ci
  - '.github/workflows/ci.yml'
  - '.github/actions/test-image/**'
  - '.github/changes.yml'
  - '!README.md'
  - '!cmd/README.md'
shared: &shared
  - *ci
  - '.github/workflows/images.yml'
  - '.github/workflows/release.yml'
  - '.github/actions/build-image/**'
  - '.github/actions/retag-image/**'
  - '.github/scripts/image-modes.sh'
  - '.dockerignore'
go:
  - *ci
  - 'cmd/**'
  - 'go.mod'
  - 'go.sum'
deploy:
  - *ci
  - 'deploy/**'
hermes-tests:
  - *ci
  - 'hermes/**'
  - 'config/hermes/**'
agent-tools:
  - *shared
  - 'images/agent-tools/**'
  - 'cmd/**'
  - 'go.mod'
  - 'go.sum'
hermes:
  - *shared
  - 'images/hermes/**'
  - 'config/hermes/**'
  - 'hermes/**'
hermes-webui:
  - *shared
  - 'images/hermes-webui/**'
  - 'images/hermes/bin/**'
  - 'images/hermes/install-tools'
  - 'images/hermes/mise.toml'
  - 'images/hermes/profile.d/agent-path.sh'
  - 'images/hermes/gitconfig'
  - 'config/hermes/config.yaml'
  - 'config/hermes/profiles/default/config.yaml'
