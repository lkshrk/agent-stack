name: WoW seasonal bundle refresh

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC; avoid the busy start of the hour.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Recheck recommendations even when source fingerprints are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wow-season-source-check
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      refresh_needed: ${{ steps.inspect.outputs.needed }}
      candidate_ready: ${{ steps.refresh.outcome == 'success' }}
    steps:
      - name: Explain pipeline stages and trigger
        env:
          EVENT: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
        run: |
          echo "Trigger: $EVENT; ref: $GITHUB_REF; commit: $GITHUB_SHA"
          echo "Force AI recheck: $FORCE_REFRESH"
          echo "1. Fetch public sources and compare fingerprints with the saved baseline (no AI)."
          echo "2. Run Codex only when the source check requests it or force_refresh=true."
          echo "3. Validate candidate data and stage accepted changes on a branch."
          echo "4. Open a pull request for accepted changes; merging it lets the Release workflow decide on a release."

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record base commit
        id: base
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Trusted base commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Fetch sources, compare fingerprints and explain AI run decision
        id: inspect
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
        run: |
          python3 plugins/personal/scripts/check_wow_season_updates.py --json > wow-source-observation.json
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'plugins/personal/scripts')
          from check_wow_season_updates import report
          data = json.load(open('wow-source-observation.json'))
          data['force_refresh'] = os.environ['FORCE_REFRESH'] == 'true'
          with open('wow-source-observation.json', 'w') as out:
              json.dump(data, out, indent=2)
          needed = data['requires_refresh'] or data['force_refresh']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('needed=' + str(needed).lower() + '\n')
          summary = report(data['rows'], data['current'], force_refresh=data['force_refresh'])
          print(summary, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          if any(row['status'] == 'unavailable' for row in data['rows']):
              print('::warning::Some sources could not be checked. See the source report for known versus new monitoring gaps.')
          PY

      - name: Preserve trusted source observations
        id: observation
        uses: actions/upload-artifact@v7
        with:
          name: wow-source-observation
          path: wow-source-observation.json
          retention-days: 30
          if-no-files-found: error

      - name: Configure refresh provider
        if: steps.inspect.outputs.needed == 'true'
        id: provider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WOW_REFRESH_BASE_URL: ${{ vars.WOW_REFRESH_BASE_URL }}
          WOW_REFRESH_MODEL: ${{ vars.WOW_REFRESH_MODEL }}
          WOW_REFRESH_GATEWAY_KEY: ${{ secrets.WOW_REFRESH_API_KEY }}
        run: |
          echo "AI refresh requested; validating provider configuration. Credentials and provider arguments are not logged."
          python3 plugins/personal/scripts/configure_wow_refresh_provider.py >> "$GITHUB_OUTPUT"

      - name: Explain AI refresh scope
        if: steps.inspect.outputs.needed == 'true'
        env:
          PROVIDER_MODE: ${{ steps.provider.outputs.mode }}
          PROVIDER_MODEL: ${{ steps.provider.outputs.model }}
        run: |
          echo "Starting Codex refresh with provider mode: $PROVIDER_MODE."
          echo "Model: ${PROVIDER_MODEL:-Codex action default}"
          echo "Input: wow-source-observation.json and the bundled seasonal records."
          echo "Expected result: candidate data plus wow-refresh-result.json; this job cannot publish changes."

      - name: Refresh affected setup records with Codex
        if: steps.inspect.outputs.needed == 'true'
        id: refresh
        uses: openai/codex-action@v1
        env:
          WOW_REFRESH_GATEWAY_KEY: ${{ steps.provider.outputs.mode == 'gateway' && secrets.WOW_REFRESH_API_KEY || '' }}
        with:
          openai-api-key: ${{ steps.provider.outputs.mode == 'openai' && secrets.OPENAI_API_KEY || '' }}
          prompt-file: .github/codex/prompts/refresh-wow-season.md
          output-file: wow-refresh-result.json
          sandbox: workspace-write
          safety-strategy: drop-sudo
          model: ${{ steps.provider.outputs.model }}
          codex-args: ${{ steps.provider.outputs.codex_args }}

      # Only data is exported from the agent's runner; publishing uses a fresh job.
      - name: Keep candidate data
        id: candidate
        if: steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: wow-refresh-candidate
          path: plugins/personal/skills/wow-spec/assets/season-data/retail/season-mn-2/
          retention-days: 30
          if-no-files-found: error

      - name: Keep refresh result
        id: result
        if: always() && (steps.refresh.outcome == 'success' || (steps.refresh.outcome != 'skipped' && hashFiles('wow-refresh-result.json') != ''))
        uses: actions/upload-artifact@v7
        with:
          name: wow-refresh-result
          path: wow-refresh-result.json
          retention-days: 30
          if-no-files-found: error

      - name: Summarize detection and AI stage outcomes
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NEEDED: ${{ steps.inspect.outputs.needed }}
          STAGES: >-
            {"checkout":{"outcome":"${{ steps.checkout.outcome }}"},"base":{"outcome":"${{ steps.base.outcome }}"},"bun":{"outcome":"${{ steps.bun.outcome }}"},"inspect":{"outcome":"${{ steps.inspect.outcome }}"},"observation":{"outcome":"${{ steps.observation.outcome }}"},"provider":{"outcome":"${{ steps.provider.outcome }}"},"refresh":{"outcome":"${{ steps.refresh.outcome }}"},"candidate":{"outcome":"${{ steps.candidate.outcome }}"},"result":{"outcome":"${{ steps.result.outcome }}"}}
        run: |
          python3 - <<'PY'
          import json, os
          stages = json.loads(os.environ['STAGES'])
          lines = ['## Detection and AI refresh: ' + os.environ['JOB_STATUS'], '',
                   '| Stage | Outcome |', '| --- | --- |']
          for key, label in [('checkout', 'Checkout'), ('base', 'Record trusted commit'), ('bun', 'Bun setup'), ('inspect', 'Source fetch and comparison'),
                             ('observation', 'Observation artifact'), ('provider', 'Provider configuration'),
                             ('refresh', 'Codex refresh'), ('candidate', 'Candidate artifact'), ('result', 'Result artifact')]:
              lines.append('| ' + label + ' | ' + stages.get(key, {}).get('outcome', 'not reached') + ' |')
          if os.environ['NEEDED'] == 'false':
              lines += ['', 'AI refresh skipped: no triggering source drift and force_refresh=false. Provider setup, candidate generation and publishing are intentionally skipped.',
                        'To recheck recommendations anyway, run this workflow with force_refresh enabled.']
          elif stages.get('refresh', {}).get('outcome') == 'success' and os.environ['JOB_STATUS'] == 'success':
              lines += ['', 'AI candidate generated and artifacts saved. Publishing still requires data validation and CI; no release is confirmed here.']
          else:
              lines += ['', 'Refresh did not complete successfully. Inspect the first failed stage above; later skipped stages are not evidence of unchanged sources. A missing result artifact means no result file was produced.']
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          PY

  publish:
    needs: refresh
    if: needs.refresh.outputs.candidate_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      pushed: ${{ steps.stage.outputs.pushed }}
    permissions:
      contents: write
      pull-requests: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
      BUNDLE_DIR: plugins/personal/skills/wow-spec/assets/season-data/retail/season-mn-2
      STAGING_BRANCH: automation/wow-season-refresh
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted base
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.refresh.outputs.base_sha }}

      - name: Download candidate data
        id: candidate_download
        uses: actions/download-artifact@v8
        with:
          name: wow-refresh-candidate
          path: ${{ runner.temp }}/wow-candidate

      - name: Download source observations
        id: observation_download
        uses: actions/download-artifact@v8
        with:
          name: wow-source-observation
          path: ${{ runner.temp }}/wow-observation

      - name: Download refresh result
        id: result_download
        uses: actions/download-artifact@v8
        with:
          name: wow-refresh-result
          path: ${{ runner.temp }}/wow-result

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Validate and apply data-only changes
        id: apply
        run: |
          echo "Validating candidate against trusted source observations and base $BASE_SHA."
          echo "Only accepted seasonal data changes may be applied; unsupported observations retain previous values."
          python3 plugins/personal/scripts/apply_wow_season_refresh.py \
            --candidate "$RUNNER_TEMP/wow-candidate" \
            --result "$RUNNER_TEMP/wow-result/wow-refresh-result.json" \
            --observation "$RUNNER_TEMP/wow-observation/wow-source-observation.json" \
            > "$RUNNER_TEMP/wow-apply.json"
          cat "$RUNNER_TEMP/wow-apply.json"
          echo "release=$(jq -r '.release' "$RUNNER_TEMP/wow-apply.json")" >> "$GITHUB_OUTPUT"
          jq -r '.summary' "$RUNNER_TEMP/wow-apply.json" > "$RUNNER_TEMP/wow-summary.md"
          echo "Running repository tests and whitespace validation before staging."
          (cd plugins/personal && bun test)
          git diff --check

      - name: Commit refresh on staging branch
        id: stage
        env:
          RELEASE: ${{ steps.apply.outputs.release }}
        run: |
          git add -- "$BUNDLE_DIR"
          if git diff --cached --quiet; then
            echo "No accepted bundle changes to commit. Staging and pull request are skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Accepted changes (file counts only):"
          git diff --cached --stat
          echo "Recommendation change: $RELEASE"
          if [ "$RELEASE" = "true" ]; then
            git commit -m "fix(wow): refresh seasonal setup bundle"
          else
            git commit -m "chore(wow): advance seasonal source fingerprints"
            echo "Only source fingerprints changed; no recommendation update." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "Staged commit $(git rev-parse HEAD) on $STAGING_BRANCH; default branch not updated."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.stage.outputs.pushed == 'true'
        env:
          RELEASE: ${{ steps.apply.outputs.release }}
        run: |
          title="chore(wow): seasonal bundle refresh"
          [ "$RELEASE" = "true" ] && title="fix(wow): refresh seasonal setup bundle"
          if [ -z "$(gh pr list --head "$STAGING_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$STAGING_BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/wow-summary.md"
          fi
          gh pr list --head "$STAGING_BRANCH" --state open --json url --jq '.[].url' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize applied refresh
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PUSHED: ${{ steps.stage.outputs.pushed }}
          STAGES: >-
            {"checkout":{"outcome":"${{ steps.checkout.outcome }}"},"candidate_download":{"outcome":"${{ steps.candidate_download.outcome }}"},"observation_download":{"outcome":"${{ steps.observation_download.outcome }}"},"result_download":{"outcome":"${{ steps.result_download.outcome }}"},"bun":{"outcome":"${{ steps.bun.outcome }}"},"apply":{"outcome":"${{ steps.apply.outcome }}"},"stage":{"outcome":"${{ steps.stage.outcome }}"},"pr":{"outcome":"${{ steps.pr.outcome }}"}}
        run: |
          python3 - <<'PY'
          import json, os
          stages = json.loads(os.environ['STAGES'])
          lines = ['## Candidate publication: ' + os.environ['JOB_STATUS'], '', '| Stage | Outcome |', '| --- | --- |']
          for key, label in [('checkout', 'Trusted checkout'), ('candidate_download', 'Download candidate'),
                             ('observation_download', 'Download observations'), ('result_download', 'Download result'),
                             ('bun', 'Bun setup'), ('apply', 'Validate data and run tests'), ('stage', 'Commit and stage'),
                             ('pr', 'Pull request')]:
              lines.append('| ' + label + ' | ' + stages.get(key, {}).get('outcome', 'not reached') + ' |')
          if os.environ['JOB_STATUS'] != 'success':
              lines += ['', 'Publication incomplete. Review the failed stage; the staging branch or pull request may already exist if a later stage failed. Do not assume rollback.']
          elif os.environ['PUSHED'] == 'false':
              lines += ['', 'No accepted data changes: no staging push or pull request needed.']
          else:
              lines += ['', 'Accepted update staged and pull request opened; it awaits review and merge. Checks do not start automatically for a pull request opened by the workflow token.']
          if stages.get('apply', {}).get('outcome') == 'success':
              result_path = os.path.join(os.environ['RUNNER_TEMP'], 'wow-result/wow-refresh-result.json')
              with open(result_path) as source:
                  data = json.load(source)
              lines += ['', 'Validated AI result: ' + data['status'], '', data['summary']]
              if data['unresolved_sources']:
                  lines += ['', 'Unresolved sources (previous values retained):']
                  lines += ['- ' + url for url in data['unresolved_sources']]
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          PY

  summary:
    name: Explain final pipeline outcome
    needs: [refresh, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report run, skip or failure reason
        env:
          REFRESH_RESULT: ${{ needs.refresh.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          NEEDED: ${{ needs.refresh.outputs.refresh_needed }}
          PUSHED: ${{ needs.publish.outputs.pushed }}
        run: |
          python3 - <<'PY'
          import os
          refresh, publish, needed = (os.environ[k] for k in ['REFRESH_RESULT', 'PUBLISH_RESULT', 'NEEDED'])
          if refresh == 'skipped':
              reason = 'Refresh skipped: this workflow runs only on the default branch.'
          elif refresh != 'success':
              reason = 'Detection/AI job ' + refresh + '; publishing did not receive a successful candidate. Inspect that job, not the skipped publish steps.'
          elif needed == 'false':
              reason = 'Source detection ran successfully; no triggering drift and no forced recheck. AI and publishing skipped. Enable force_refresh for an AI recheck anyway.'
          elif publish == 'success':
              if os.environ.get('PUSHED') == 'false':
                  reason = 'AI recheck completed with no accepted data changes. Nothing was pushed.'
              else:
                  reason = 'Accepted update staged and a pull request opened for review. Nothing reached the default branch.'
          else:
              reason = 'AI candidate produced; publication ' + publish + '. Inspect validation and pull request outcomes; no end-to-end success is claimed.'
          summary = '# WoW pipeline outcome\n\nDetection/AI: ' + refresh + '\n\nPublication: ' + publish + '\n\n' + reason + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          PY
