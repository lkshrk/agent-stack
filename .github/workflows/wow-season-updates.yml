name: WoW seasonal bundle refresh

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC; avoid the busy start of the hour.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Send every spec with a readable guide to Claude Code (within the cap), even without differences
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wow-season-source-check
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      bundle_dir: ${{ steps.bundle.outputs.dir }}
      matrix: ${{ steps.inspect.outputs.matrix }}
      claude_needed: ${{ steps.inspect.outputs.claude_needed }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record base commit
        id: base
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Trusted base commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve the active season bundle
        id: bundle
        run: |
          dir="$(realpath --relative-to="$PWD" "$(python3 plugins/personal/automation/check_wow_season_updates.py --print-bundle)")"
          echo "Active bundle: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Fetch sources, fingerprint guides and pre-diff every spec
        id: inspect
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
          MAX_SPECS: ${{ vars.WOW_REFRESH_MAX_SPECS || '12' }}
        run: |
          python3 plugins/personal/automation/check_wow_season_updates.py --json > wow-source-observation.json
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, 'plugins/personal/automation')
          from check_wow_season_updates import report
          data = json.load(open('wow-source-observation.json'))
          force = os.environ['FORCE_REFRESH'] == 'true'
          data['force_refresh'] = force
          try:
              cap = min(max(int(os.environ['MAX_SPECS']), 1), 40)
          except ValueError:
              sys.exit('::error::WOW_REFRESH_MAX_SPECS must be a whole number between 1 and 40.')
          command = ['python3', 'plugins/personal/automation/prediff_wow_specs.py', '--observation', 'wow-source-observation.json',
                     '--cap', str(cap), '--out', 'wow-prediff.json'] + (['--force'] if force else [])
          subprocess.run(command, check=True)
          prediff = json.load(open('wow-prediff.json'))
          data['prediff'] = {k: v for k, v in prediff.items() if k != 'specs'}
          with open('wow-source-observation.json', 'w') as out:
              json.dump(data, out, indent=2)
          claude_needed = bool(prediff['selected'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(prediff['selected']) + '\n')
              out.write('claude_needed=' + str(claude_needed).lower() + '\n')
          summary = report(data['rows'], data['current'], force_refresh=force)
          summary += ('\n## Spec pre-diff\n\n'
                      f'{len(prediff["unchanged"])} unchanged (no Claude call); {len(prediff["changed"])} with differences; '
                      f'{len(prediff["incomplete"])} with a guide missing a parsable part; '
                      f'{len(prediff["unavailable"])} without a readable guide. '
                      f'Claude runs: {len(prediff["selected"])} (cap {cap}); deferred: {len(prediff["deferred"])}.\n')
          print(summary, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          if any(row['status'] == 'unavailable' for row in data['rows']):
              print('::warning::Some sources could not be checked. See the source report for known versus new monitoring gaps.')
          PY

      - name: Upload observation
        id: upload
        if: always() && steps.inspect.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wow-observation
          path: wow-source-observation.json
          retention-days: 30
          if-no-files-found: error

      - name: Summarize detection outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CLAUDE_NEEDED: ${{ steps.inspect.outputs.claude_needed }}
          EVENT: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
          STAGES: >-
            {"checkout":{"outcome":"${{ steps.checkout.outcome }}"},"base":{"outcome":"${{ steps.base.outcome }}"},"bundle":{"outcome":"${{ steps.bundle.outcome }}"},"inspect":{"outcome":"${{ steps.inspect.outcome }}"},"upload":{"outcome":"${{ steps.upload.outcome }}"}}
        run: |
          python3 - <<'PY'
          import json, os
          stages = json.loads(os.environ['STAGES'])
          lines = ['## Detection: ' + os.environ['JOB_STATUS'], '',
                   'Trigger: ' + os.environ['EVENT'] + '; force_refresh: ' + os.environ['FORCE_REFRESH'], '',
                   '| Stage | Outcome |', '| --- | --- |']
          for key, label in [('checkout', 'Checkout'), ('base', 'Record trusted commit'), ('bundle', 'Resolve season bundle'),
                             ('inspect', 'Source fetch, fingerprints and pre-diff'), ('upload', 'Observation artifact')]:
              lines.append('| ' + label + ' | ' + stages.get(key, {}).get('outcome', 'not reached') + ' |')
          if os.environ['JOB_STATUS'] != 'success':
              lines += ['', 'Detection did not complete successfully. Inspect the first failed stage above; later skipped stages are not evidence of unchanged sources.']
          elif os.environ['CLAUDE_NEEDED'] == 'false':
              lines += ['', 'Claude Code skipped: no spec differs from its live guide. Deterministic verification advances and tooltip enrichment still run in publishing.',
                        'Enable force_refresh to send unchanged specs to Claude Code too, within the cap.']
          else:
              lines += ['', 'Specs with differences are rechecked one Claude Code run each; see the matrix jobs.']
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          PY

  refresh:
    name: refresh spec ${{ matrix.spec }}
    needs: inspect
    if: needs.inspect.outputs.claude_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        spec: ${{ fromJSON(needs.inspect.outputs.matrix) }}
    env:
      BUNDLE_DIR: ${{ needs.inspect.outputs.bundle_dir }}
    steps:
      - name: Check out trusted base
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.base_sha }}
          persist-credentials: false

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Download observation
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wow-observation
          path: ${{ runner.temp }}/observation

      - name: Write the narrow task for this spec
        id: task
        env:
          SPEC: ${{ matrix.spec }}
        run: |
          python3 plugins/personal/automation/prediff_wow_specs.py \
            --observation "$RUNNER_TEMP/observation/wow-source-observation.json" \
            --task "$SPEC" --task-out wow-spec-task.json

      - name: Configure refresh gateway
        id: provider
        env:
          WOW_REFRESH_BASE_URL: ${{ vars.WOW_REFRESH_BASE_URL }}
          WOW_REFRESH_MODEL: ${{ vars.WOW_REFRESH_MODEL }}
          WOW_REFRESH_API_KEY: ${{ secrets.WOW_REFRESH_API_KEY }}
        run: |
          echo "Validating gateway configuration. Credentials and arguments are not logged."
          python3 plugins/personal/automation/prepare_wow_refresh.py >> "$GITHUB_OUTPUT"

      - name: Recheck this spec with Claude Code
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          ANTHROPIC_BASE_URL: ${{ steps.provider.outputs.base_url }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku
        with:
          anthropic_api_key: ${{ secrets.WOW_REFRESH_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Follow the instructions in plugins/personal/automation/prompts/refresh-wow-season.md for spec ${{ matrix.spec }}.
          claude_args: ${{ steps.provider.outputs.claude_args }}

      - name: Save structured result and candidate
        id: result_file
        if: steps.claude.outcome == 'success'
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          SPEC: ${{ matrix.spec }}
        run: |
          [ -n "$RESULT" ] || { echo "Claude Code returned no structured result."; exit 1; }
          mkdir -p wow-spec-out
          printf '%s' "$RESULT" | jq --argjson spec "$SPEC" '. | select(.spec_id == $spec)' > wow-spec-out/result.json
          [ -s wow-spec-out/result.json ] || { echo "Result is for a different spec."; exit 1; }
          cp -r "$BUNDLE_DIR" wow-spec-out/candidate

      # Only data leaves the agent's runner; publishing uses a fresh job.
      - name: Upload this spec's result
        id: upload
        if: steps.result_file.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wow-spec-${{ matrix.spec }}
          path: wow-spec-out
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [inspect, refresh]
    if: always() && needs.inspect.result == 'success' && needs.refresh.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      pushed: ${{ steps.stage.outputs.pushed }}
    permissions:
      contents: write
      pull-requests: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
      BUNDLE_DIR: ${{ needs.inspect.outputs.bundle_dir }}
      FORCE_REFRESH: ${{ inputs.force_refresh || false }}
      STAGING_BRANCH: automation/wow-season-refresh
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted base
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.base_sha }}

      - name: Download observation
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wow-observation
          path: ${{ runner.temp }}/wow-refresh

      - name: Download per-spec Claude results
        id: parts
        if: needs.inspect.outputs.claude_needed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wow-spec-*
          path: ${{ runner.temp }}/wow-parts

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Validate and apply data-only changes
        id: apply
        run: |
          echo "Validating candidate against trusted source observations and base $BASE_SHA."
          echo "Only accepted seasonal data changes may be applied; unsupported observations retain previous values."
          mkdir -p "$RUNNER_TEMP/wow-parts"
          python3 plugins/personal/automation/apply_wow_season_refresh.py \
            --parts "$RUNNER_TEMP/wow-parts" \
            --observation "$RUNNER_TEMP/wow-refresh/wow-source-observation.json" \
            > "$RUNNER_TEMP/wow-apply.json"
          cat "$RUNNER_TEMP/wow-apply.json"
          echo "release=$(jq -r '.release' "$RUNNER_TEMP/wow-apply.json")" >> "$GITHUB_OUTPUT"
          jq -r '.summary' "$RUNNER_TEMP/wow-apply.json" > "$RUNNER_TEMP/wow-summary.md"
          echo "Running repository tests and whitespace validation before staging."
          (cd plugins/personal && bun test)
          git diff --check

      - name: Commit refresh on staging branch
        id: stage
        env:
          RELEASE: ${{ steps.apply.outputs.release }}
        run: |
          git add -- "$BUNDLE_DIR"
          if git diff --cached --quiet; then
            echo "No accepted bundle changes to commit. Staging and pull request are skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Accepted changes (file counts only):"
          git diff --cached --stat
          echo "Recommendation change: $RELEASE"
          if [ "$RELEASE" = "true" ]; then
            git commit -m "fix(wow): refresh seasonal setup bundle"
          else
            git commit -m "chore(wow): advance seasonal verification and source fingerprints"
            echo "Only verification metadata, fingerprints or tooltip fields changed; no recommendation update." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "Staged commit $(git rev-parse HEAD) on $STAGING_BRANCH; default branch not updated."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.stage.outputs.pushed == 'true'
        env:
          RELEASE: ${{ steps.apply.outputs.release }}
        run: |
          title="chore(wow): seasonal bundle refresh"
          [ "$RELEASE" = "true" ] && title="fix(wow): refresh seasonal setup bundle"
          if [ -z "$(gh pr list --head "$STAGING_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$STAGING_BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/wow-summary.md"
          fi
          gh pr list --head "$STAGING_BRANCH" --state open --json url --jq '.[].url' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize applied refresh
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PUSHED: ${{ steps.stage.outputs.pushed }}
          STAGES: >-
            {"checkout":{"outcome":"${{ steps.checkout.outcome }}"},"download":{"outcome":"${{ steps.download.outcome }}"},"bun":{"outcome":"${{ steps.bun.outcome }}"},"apply":{"outcome":"${{ steps.apply.outcome }}"},"stage":{"outcome":"${{ steps.stage.outcome }}"},"pr":{"outcome":"${{ steps.pr.outcome }}"}}
        run: |
          python3 - <<'PY'
          import json, os
          stages = json.loads(os.environ['STAGES'])
          lines = ['## Candidate publication: ' + os.environ['JOB_STATUS'], '', '| Stage | Outcome |', '| --- | --- |']
          for key, label in [('checkout', 'Trusted checkout'), ('download', 'Download refresh outputs'),
                             ('bun', 'Bun setup'), ('apply', 'Validate data and run tests'), ('stage', 'Commit and stage'),
                             ('pr', 'Pull request')]:
              lines.append('| ' + label + ' | ' + stages.get(key, {}).get('outcome', 'not reached') + ' |')
          if os.environ['JOB_STATUS'] != 'success':
              lines += ['', 'Publication incomplete. Review the failed stage; the staging branch or pull request may already exist if a later stage failed. Do not assume rollback.']
          elif os.environ['PUSHED'] == 'false':
              lines += ['', 'No accepted data changes: no staging push or pull request needed.']
          else:
              lines += ['', 'Accepted update staged and pull request opened; it awaits review and merge. Checks do not start automatically for a pull request opened by the workflow token.']
          if stages.get('apply', {}).get('outcome') == 'success':
              with open(os.path.join(os.environ['RUNNER_TEMP'], 'wow-apply.json')) as source:
                  data = json.load(source)
              lines += ['', 'Validated refresh: ' + data['status'], '', data['summary']]
              if data['status'] == 'partial':
                  lines += ['', 'Unresolved sources keep their previous values and are retried next run.']
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          PY

  summary:
    name: Explain final pipeline outcome
    needs: [inspect, refresh, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report run, skip or failure reason
        env:
          INSPECT_RESULT: ${{ needs.inspect.result }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          NEEDED: ${{ needs.inspect.outputs.claude_needed }}
          PUSHED: ${{ needs.publish.outputs.pushed }}
        run: |
          python3 - <<'PY'
          import os
          inspect, refresh, publish, needed = (os.environ[k] for k in ['INSPECT_RESULT', 'REFRESH_RESULT', 'PUBLISH_RESULT', 'NEEDED'])
          if inspect == 'skipped':
              reason = 'Refresh skipped: this workflow runs only on the default branch.'
          elif inspect != 'success':
              reason = 'Detection job ' + inspect + '; no candidate was produced. Inspect that job, not the skipped later jobs.'
          elif publish == 'success':
              ai = 'no spec needed Claude Code' if needed == 'false' else 'per-spec Claude Code runs: ' + refresh
              if os.environ.get('PUSHED') == 'false':
                  reason = 'Detection ran (' + ai + '). No accepted data changes. Nothing was pushed.'
              else:
                  reason = 'Detection ran (' + ai + '). Accepted update staged and a pull request opened for review. Nothing reached the default branch.'
          else:
              reason = 'Detection ran; publication ' + publish + '. Inspect validation and pull request outcomes; no end-to-end success is claimed.'
          summary = '# WoW pipeline outcome\n\nDetection: ' + inspect + '\n\nClaude Code: ' + refresh + '\n\nPublication: ' + publish + '\n\n' + reason + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          PY
