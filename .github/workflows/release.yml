name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  automerge-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge "${{ needs.release-please.outputs.pr }}" --repo "${{ github.repository }}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: read
      packages: write
