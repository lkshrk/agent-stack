name: go

on:
  push:
    branches: [main]
    paths: ["cmd/**", "go.mod", "go.sum", ".github/workflows/go.yml"]
  pull_request:
    paths: ["cmd/**", "go.mod", "go.sum", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
