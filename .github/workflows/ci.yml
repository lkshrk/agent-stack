name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      images: ${{ steps.images.outputs.images }}
      policies: ${{ steps.filter.outputs.policies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hermes and hermes-webui pin the same Hermes image
        run: |
          [ "$(grep -h '^ARG HERMES_IMAGE=' images/hermes/Dockerfile)" = "$(grep -h '^ARG HERMES_IMAGE=' images/hermes-webui/Dockerfile)" ]
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.dockerignore'
            omnigent: &omnigent
              - 'policies/omnigent/**'
              - 'bundles/**'
              - 'config/omnigent/**'
              - 'images/omnigent-host/codex/**'
            go:
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
            policies:
              - *omnigent
            omnigent-host:
              - *shared
              - *omnigent
              - 'images/omnigent-host/**'
              - '.claude-plugin/**'
              - '.agents/**'
              - 'plugins/**'
            omnigent-server:
              - *shared
              - *omnigent
              - 'images/omnigent-server/**'
            agent-tools:
              - *shared
              - 'images/agent-tools/**'
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
            hermes:
              - *shared
              - 'images/hermes/**'
              - 'config/hermes/**'
            hermes-webui:
              - *shared
              - 'images/hermes-webui/**'
              - 'images/hermes/**'
              - 'config/hermes/**'
      - name: Images whose build inputs changed
        id: images
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          echo "images=$(jq -c '[.[] | select(IN("omnigent-host", "omnigent-server", "agent-tools", "hermes", "hermes-webui"))]' <<<"$CHANGES")" >>"$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  policies:
    needs: changes
    if: needs.changes.outputs.policies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s policies/omnigent/tests -t policies/omnigent -v

  # Only pushes to main write the registry build cache; pull requests read it anonymously.
  images:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      CACHE: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          target: ${{ startsWith(matrix.image, 'omnigent-') && 'test' || '' }}
          push: false
          load: ${{ matrix.image == 'hermes-webui' }}
          outputs: ${{ matrix.image != 'hermes-webui' && 'type=cacheonly' || '' }}
          tags: agent-stack/${{ matrix.image }}:ci
          cache-from: ${{ env.CACHE }}
          cache-to: ${{ github.event_name == 'push' && format('{0},mode=max,ignore-error=true', env.CACHE) || '' }}
      - name: Test a release build of the server, which pins the runner of the same release
        if: matrix.image == 'omnigent-server'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/omnigent-server/Dockerfile
          platforms: linux/amd64
          target: test
          push: false
          outputs: type=cacheonly
          build-args: AGENT_STACK_VERSION=9.8.7
          cache-from: ${{ env.CACHE }}
      - name: Start hermes-webui offline and require a healthy agent
        if: matrix.image == 'hermes-webui'
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          sudo chown 10000:10000 "$data"
          docker run -d --name webui --network none -e HERMES_HOME=/opt/data \
            -e HERMES_WEBUI_PASSWORD=ci-smoke-password -v "$data:/opt/data" agent-stack/hermes-webui:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' webui)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' webui)" = true ] || break
            sleep 4
          done
          docker logs webui
          [ "$status" = healthy ]
          grep -q 'Dependencies already installed' <(docker logs webui 2>&1)
          grep -q 'Hermes agent critical imports verified' <(docker logs webui 2>&1)
          docker exec -u 10000 webui test -r /etc/hermes/config.yaml
      - name: Runner disk left after the build
        if: always() && matrix.image == 'omnigent-host'
        run: df -h /

  gate:
    if: always()
    needs: [changes, go, policies, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran to succeed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
