name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - name: hermes and hermes-webui pin the same Hermes image
        run: |
          [ "$(grep -h '^ARG HERMES_IMAGE=' images/hermes/Dockerfile)" = "$(grep -h '^ARG HERMES_IMAGE=' images/hermes-webui/Dockerfile)" ]
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
            images:
              - 'images/**'
              - 'agents/**'
              - 'config/**'
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [omnigent-host, omnigent-server, agent-tools, hermes, hermes-webui]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: ${{ matrix.image == 'hermes-webui' }}
          tags: agent-stack/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Start hermes-webui offline and require a healthy agent
        if: matrix.image == 'hermes-webui'
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          sudo chown 10000:10000 "$data"
          docker run -d --name webui --network none -e HERMES_HOME=/opt/data \
            -e HERMES_WEBUI_PASSWORD=ci-smoke-password -v "$data:/opt/data" agent-stack/hermes-webui:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' webui)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' webui)" = true ] || break
            sleep 4
          done
          docker logs webui
          [ "$status" = healthy ]
          docker logs webui 2>&1 | grep -q 'Dependencies already installed'
          docker logs webui 2>&1 | grep -q 'Hermes agent critical imports verified'
          docker exec -u 10000 webui test -r /etc/hermes/config.yaml

  gate:
    if: always()
    needs: [changes, go, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran to succeed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
