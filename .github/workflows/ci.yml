name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      images: ${{ steps.images.outputs.images }}
      policies: ${{ github.event_name != 'pull_request' || steps.filter.outputs.policies == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false
      - name: hermes and hermes-webui pin the same Hermes image
        run: |
          [ "$(grep -h '^ARG HERMES_IMAGE=' images/hermes/Dockerfile)" = "$(grep -h '^ARG HERMES_IMAGE=' images/hermes-webui/Dockerfile)" ]
      - name: omnigent-host and omnigent-server use the same Omnigent version
        run: |
          host=$(sed -nE 's/^ARG OMNIGENT_HOST_IMAGE=[^@]*:(v[^:@]+)@.*/\1/p' images/omnigent-host/Dockerfile)
          server=$(sed -nE 's/^ARG OMNIGENT_SERVER_IMAGE=[^@]*:(v[^:@]+)@.*/\1/p' images/omnigent-server/Dockerfile)
          echo "omnigent-host ${host:-?}, omnigent-server ${server:-?}"
          [ -n "$host" ] && [ "$host" = "$server" ]
      - name: Last commit main passed ci on, empty to build everything
        id: before
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          if [[ $sha =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
            echo "sha=$sha" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::no successful ci run on an ancestor of HEAD; building every image"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request' || steps.before.outputs.sha != ''
        id: filter
        with:
          base: ${{ steps.before.outputs.sha }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          filters: .github/changes.yml
          predicate-quantifier: some-with-excludes
      - name: Images to build, only the changed ones when the changes are known
        id: images
        env:
          ALL: '["omnigent-host", "omnigent-server", "agent-tools", "hermes", "hermes-webui"]'
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ -n "$CHANGES" ]; then
            echo "images=$(jq -c --argjson all "$ALL" '[.[] | select(IN($all[]))]' <<<"$CHANGES")" >>"$GITHUB_OUTPUT"
          else
            echo "images=$(jq -c . <<<"$ALL")" >>"$GITHUB_OUTPUT"
          fi

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  policies:
    needs: changes
    if: needs.changes.outputs.policies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s policies/omnigent/tests -t policies/omnigent -v
      - run: python3 -m unittest discover -s hermes/tests -t hermes -v

  images:
    needs: changes
    if: >-
      needs.changes.outputs.images != '[]' &&
      (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-image
        with:
          image: ${{ matrix.image }}
          token: ${{ github.token }}

  # The only job that writes the GHCR build cache, so pull requests never hold a packages write token.
  images-main:
    needs: changes
    if: >-
      needs.changes.outputs.images != '[]' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-image
        with:
          image: ${{ matrix.image }}
          write-cache: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

  gate:
    if: always()
    needs: [changes, actionlint, go, policies, images, images-main]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran to succeed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
