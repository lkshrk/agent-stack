name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hermes and hermes-webui pin the same Hermes image
        run: |
          [ "$(grep -h '^ARG HERMES_IMAGE=' images/hermes/Dockerfile)" = "$(grep -h '^ARG HERMES_IMAGE=' images/hermes-webui/Dockerfile)" ]
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
            images:
              - 'images/**'
              - 'bundles/**'
              - 'config/**'
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [omnigent-host, omnigent-server, agent-tools, hermes, hermes-webui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: ${{ matrix.image == 'hermes-webui' }}
          tags: agent-stack/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Start hermes-webui offline and require a healthy agent
        if: matrix.image == 'hermes-webui'
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          sudo chown 10000:10000 "$data"
          docker run -d --name webui --network none -e HERMES_HOME=/opt/data \
            -e HERMES_WEBUI_PASSWORD=ci-smoke-password -v "$data:/opt/data" agent-stack/hermes-webui:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' webui)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' webui)" = true ] || break
            sleep 4
          done
          docker logs webui
          [ "$status" = healthy ]
          grep -q 'Dependencies already installed' <(docker logs webui 2>&1)
          grep -q 'Hermes agent critical imports verified' <(docker logs webui 2>&1)
          docker exec -u 10000 webui test -r /etc/hermes/config.yaml

  gate:
    if: always()
    needs: [changes, go, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran to succeed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
