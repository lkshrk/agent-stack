name: images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release tag the images are published under, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [omnigent-host, omnigent-server, agent-tools, hermes, hermes-webui]
        include:
          - image: omnigent-server
            app: omnigent
          - image: agent-tools
            app: agent-tools
          - image: hermes
            app: hermes
          - image: hermes-webui
            app: hermes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Create h-cloud deployment token
        if: inputs.version != '' && matrix.app != ''
        id: deploy-token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.h-cloud.io
          scope: lkshrk
          identity: h-cloud-dispatch
      - name: Deploy released image through h-cloud
        if: inputs.version != '' && matrix.app != ''
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          APP: ${{ matrix.app }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg app "$APP" --arg image "$IMAGE" --arg tag "${VERSION#v}@${DIGEST}" \
            '{event_type: "image-update", client_payload: {app: $app, image: $image, tag: $tag}}' \
            | gh api --method POST repos/lkshrk/h-cloud/dispatches --input -
