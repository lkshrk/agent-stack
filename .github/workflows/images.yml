name: images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release tag the images are published under, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.sha }}
      - uses: ./.github/actions/build-image
        with:
          image: omnigent-host
          version: ${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # A constant, unlike a commit time, keeps the flattened base layer's digest across releases of the same base.
          source-date-epoch: "1767225600"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [agent-tools, hermes, hermes-webui]
        include:
          - image: agent-tools
            app: agent-tools
          - image: hermes
            app: hermes
          - image: hermes-webui
            app: hermes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.sha }}
      - uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          version: ${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          app: ${{ matrix.app }}

  # The server image pins the runner of the same release by tag, so it publishes only after the runner did.
  server:
    needs: runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.sha }}
      - uses: ./.github/actions/build-image
        with:
          image: omnigent-server
          version: ${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          app: omnigent
