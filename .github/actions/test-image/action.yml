name: test-image
description: Build one image from images/<image>/Dockerfile without publishing it, run its tests and optionally write its GHCR build cache

inputs:
  image:
    description: Directory under images/, e.g. omnigent-host
    required: true
  write-cache:
    description: "'true' to log in to GHCR and write the build cache"
    required: false
    default: "false"
  token:
    description: Token for GHCR, with packages read access to read the cache and write access to write it
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      if: inputs.token != ''
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: images/${{ inputs.image }}/Dockerfile
        platforms: linux/amd64
        target: ${{ startsWith(inputs.image, 'omnigent-') && 'test' || '' }}
        push: false
        load: ${{ inputs.image == 'hermes-webui' }}
        outputs: ${{ inputs.image != 'hermes-webui' && 'type=cacheonly' || '' }}
        tags: agent-stack/${{ inputs.image }}:ci
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.image }}:buildcache
    - name: Test a release build of the server, which pins the runner of the same release
      if: inputs.image == 'omnigent-server'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: images/omnigent-server/Dockerfile
        platforms: linux/amd64
        target: test
        push: false
        outputs: type=cacheonly
        build-args: AGENT_STACK_VERSION=9.8.7
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.image }}:buildcache
    - name: Start hermes-webui offline and require a healthy agent
      if: inputs.image == 'hermes-webui'
      shell: bash
      run: |
        set -euo pipefail
        data=$(mktemp -d)
        sudo chown 10000:10000 "$data"
        docker run -d --name webui --network none -e HERMES_HOME=/opt/data \
          -e HERMES_WEBUI_PASSWORD=ci-smoke-password -v "$data:/opt/data" agent-stack/hermes-webui:ci
        for _ in $(seq 1 30); do
          status=$(docker inspect -f '{{.State.Health.Status}}' webui)
          [ "$status" = healthy ] && break
          [ "$(docker inspect -f '{{.State.Running}}' webui)" = true ] || break
          sleep 4
        done
        docker logs webui
        [ "$status" = healthy ]
        grep -q 'Dependencies already installed' <(docker logs webui 2>&1)
        grep -q 'Hermes agent critical imports verified' <(docker logs webui 2>&1)
        docker exec -u 10000 webui test -r /etc/hermes/config.yaml
    - name: Write the GHCR build cache
      id: cache
      if: inputs.write-cache == 'true'
      continue-on-error: true
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: images/${{ inputs.image }}/Dockerfile
        platforms: linux/amd64
        target: ${{ startsWith(inputs.image, 'omnigent-') && 'test' || '' }}
        push: false
        outputs: type=cacheonly
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.image }}:buildcache,mode=max
    - name: Warn that the build cache was not written
      if: inputs.write-cache == 'true' && steps.cache.outcome == 'failure'
      shell: bash
      run: echo "::warning title=Build cache not written::ghcr.io/${{ github.repository }}/${{ inputs.image }}:buildcache was not updated; later builds of ${{ inputs.image }} start cold."
    - name: Runner disk left after the build
      if: always() && inputs.image == 'omnigent-host'
      shell: bash
      run: df -h /
