gateway:
  multiplex_profiles: true

model:
  provider: custom:litellm
  default: smart-auto
  base_url: https://openrouter.ai/api/v1

auxiliary:
  background_review:
    enabled: true

agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  reasoning_overrides: {}
  service_tier: ''
  fast_auto_seconds: 60
  personalities: {}

delegation:
  max_concurrent_children: 2
  max_spawn_depth: 1
  max_iterations: 250

memory:
  provider: openviking
  write_approval: false
  memory_enabled: true
  user_profile_enabled: true
  prefetch_spill_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10

skills:
  write_approval: false
  creation_nudge_interval: 15

# The gateway's dispatcher reads these from this profile for every assignee's cards.
kanban:
  auto_decompose: false
  review_dispatch: false
  failure_limit: 2
  max_in_progress_per_profile: 3

mcp_servers:
  linear_read:
    url: http://litellm-proxy.ai.svc.cluster.local:4000/mcp/linear_read
    headers:
      x-litellm-api-key: ${LITELLM_API_KEY}
    tools:
      include:
        - list_issues
        - get_issue
        - list_comments
        - list_projects
        - get_project
        - list_teams
        - list_issue_labels
        - list_issue_statuses
  context7:
    url: http://litellm-proxy.ai.svc.cluster.local:4000/mcp/context7
    headers:
      x-litellm-api-key: ${LITELLM_API_KEY}
  searxng:
    url: http://litellm-proxy.ai.svc.cluster.local:4000/mcp/searxng
    headers:
      x-litellm-api-key: ${LITELLM_API_KEY}

_config_version: 51

database:
  journal_mode: wal

runtime:
  nofile_soft_limit: 4096

attachments:
  storage: hermes-home

plugins:
  clone_timeout_seconds: 300

cron:
  catch_up_missed: true

terminal:
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  process_wait_auto_notify: true
  client_env_passthrough: []
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true

browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: null
  protect_first_n: 3
  idle_compact_after_seconds: 0
  hygiene_max_turn_hold_seconds: 10
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096

prompt_caching:
  cache_ttl: 5m

max_concurrent_sessions: null

group_sessions_per_user: true

streaming:
  enabled: false

platform_toolsets:
  cli:
  - hermes-cli
  telegram:
  - hermes-telegram
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat

stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
    timeout: 60
    max_retries: 1

code_execution:
  timeout: 300
  max_tool_calls: 50

display:
  compact: false
  cleanup_progress: false
  suppress_warning_notifications: false
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  streaming: true
  skin: default

telemetry:
  shared_metrics:
    enabled: false
    send: false

auth:
  adopt_external_logins: true
  codex_login_flow: device_code

updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
