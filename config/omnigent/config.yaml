sandbox:
  provider: kubernetes
  server_url: http://omnigent.ai.svc.cluster.local
  host_config:
    providers:
      litellm:
        kind: gateway
        anthropic:
          base_url: http://litellm-proxy.ai.svc.cluster.local:4000
          api_key_ref: env:LITELLM_API_KEY
        openai:
          base_url: http://litellm-proxy.ai.svc.cluster.local:4000/v1
          api_key_ref: env:LITELLM_API_KEY
          wire_api: responses
    inference:
      harnesses:
        claude-sdk:
          provider: litellm
          default_model: claude-opus
          model_allowlist: [claude-opus, claude-sonnet]
        claude-native:
          provider: litellm
          default_model: claude-sonnet
          model_allowlist: [claude-sonnet, claude-opus]
        codex-native:
          provider: litellm
          default_model: gpt-sol
          model_allowlist: [gpt-sol]
  kubernetes:
    namespace: omnigent-sandboxes
    service_account: omnigent-runner
    secret_name: omnigent-runner-env
    image: ghcr.io/lkshrk/agent-stack/omnigent-host:1.0.4@sha256:20810b7449404cffceaa13a3ab91d92f9addc35723b54f6c815ebdb5fbb3ec68
    pod_ready_timeout_s: 600
    home_size_limit: 20Gi
    resources:
      requests: {cpu: "1", memory: 4Gi, ephemeral-storage: 4Gi}
      limits: {cpu: "4", memory: 12Gi, ephemeral-storage: 24Gi}
    secret_mounts:
      - secret_name: agent-github-tokens
        mount_path: /agent-secrets/github

