sandbox:
  provider: kubernetes
  server_url: http://omnigent.ai.svc.cluster.local
  host_config:
    providers:
      litellm:
        kind: gateway
        anthropic:
          base_url: http://litellm-proxy.ai.svc.cluster.local:4000
          api_key_ref: env:LITELLM_API_KEY
        openai:
          base_url: http://litellm-proxy.ai.svc.cluster.local:4000/v1
          api_key_ref: env:LITELLM_API_KEY
          wire_api: responses
    inference:
      harnesses:
        claude-sdk:
          provider: litellm
          default_model: claude-opus
          model_allowlist: [claude-opus, claude-sonnet]
        claude-native:
          provider: litellm
          default_model: claude-sonnet
          model_allowlist: [claude-sonnet, claude-opus]
        codex-native:
          provider: litellm
          default_model: gpt-sol
          model_allowlist: [gpt-sol]
  kubernetes:
    namespace: omnigent-sandboxes
    service_account: omnigent-runner
    secret_name: omnigent-runner-env
    image: ghcr.io/lkshrk/agent-stack/omnigent-host:1.8.0@sha256:88a0e8a90ea15cd28713f74f492bf5d3a94fe617b79870217c07cb5667d3af3c
    pod_ready_timeout_s: 600
    home_size_limit: 20Gi
    resources:
      requests: {cpu: "1", memory: 4Gi, ephemeral-storage: 4Gi}
      limits: {cpu: "4", memory: 12Gi, ephemeral-storage: 24Gi}
    secret_mounts:
      - secret_name: agent-github-tokens
        mount_path: /agent-secrets/github

policy_modules: [agent_stack_policies]

policies:
  no_merge:
    type: function
    function:
      path: agent_stack_policies.merge.no_merge
      arguments: {}
  path_guard:
    type: function
    function:
      path: agent_stack_policies.paths.path_guard
      arguments:
        deny:
          - ".github/workflows/**"
          - "**/*.sops.yaml"
          - "**/.env"
          - "**/.env.*"
          - "**/*.pem"
          - "**/*.key"
          - ".pilot/**"
          - AGENTS.md
          - CLAUDE.md
          - "lefthook.y*ml"
          - CODEOWNERS
        exempt: ["**/.env.example"]
