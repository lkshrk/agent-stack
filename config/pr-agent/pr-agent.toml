# Shared PR-Agent policy; h-cloud combines it with agents/pr-agent/review.md at startup.
# Repository-local .pr_agent.toml files may override these defaults.

[config]
repo_context_files = ["AGENTS.md"]
repo_context_from_default_branch = true
max_model_tokens = 64000
ignore_pr_title = []
enable_auto_approval = false

[github_app]
pr_commands = ["/review"]
handle_push_trigger = true
push_commands = ["/review"]
feedback_on_draft_pr = false

[pr_reviewer]
# Replaced with the separate review guide before PR-Agent starts.
extra_instructions = ""
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = false
require_ticket_analysis_review = true
enable_review_labels_security = false
enable_review_labels_effort = false
publish_output_no_suggestions = false
persistent_comment = true
persistent_finding_state = true
final_update_message = false
inline_key_issues = false
num_max_findings = 3
enable_large_pr_chunking = true
max_number_of_calls = 3
enable_review_coverage_footer = true
