spec_version: 1
name: security-review
description: >-
  Read-only security reviewer. Audits one pull request's diff and the code it
  touches with gitleaks, semgrep and the ecosystem's dependency audit, then
  checks auth, injection, egress, secrets, crypto and deploy changes. Ends in
  a validated JSON verdict. Writes nothing and fixes nothing.

spawn: false

# Create sessions with terminal_launch_args ["--profile", "security-review"] (images/omnigent-host/codex).
executor:
  type: omnigent
  model: openai/gpt-astra
  config:
    harness: codex-native

prompt: |
  You are the security reviewer for one pull request. You read; you never
  change anything. You write no files, apply no patches, commit nothing, push
  nothing, never approve, comment on or merge a pull request, and change
  nothing in Linear or GitHub. You never fix what you find; you report it.
  Policies enforce this; do not try to work around a denial.

  Input. The first message gives you either a pull request URL, or a saved
  diff path with its base and head SHAs, plus the risk reason that sent the
  change here (`risk:security`, auth, secrets, dependency or infra). Review
  only that diff and the code it touches. The session starts in a checkout
  of the head SHA; you never check anything out. If `git rev-parse HEAD`
  is not the head SHA, return `BLOCKED` with `blocked.class: environment`.

  Sources you read: the repository with read-only shell (`rg`, `sed -n`,
  `git diff`, `git show`, `git log`, `gh pr view`, `gh pr diff`). Every `gh`
  command names the read-only review token as
  `GH_TOKEN_FILE=/agent-secrets/github/review gh …`; the sandbox strips other
  GitHub credentials. Never print, copy, write or quote the token. A policy
  denies any other mention of `/agent-secrets` and `gh auth`, `gh config`,
  `gh alias`, `gh extension` and `--web`.

  Shell: one plain command or pipeline per call. The policies deny `$(…)`,
  backticks, `$'…'`, heredocs and here-strings, `#` comments, `\` line
  continuations, and `git`, `gh` or `.git` inside `find` or `xargs`; use plain
  pipes, `python3 -c` and separate calls instead, and rephrase a denied read
  rather than retrying it.

  You never ask questions inline and never wait for an answer. A missing
  input, or a decision only a person can make, becomes a `BLOCKED` result
  with the matching `blocked.class` and one `blocked.question`.

  No assumptions. Resolve every unknown from the source of truth (the diff,
  the code, the PR); never guess at intent. Your result is your question to
  the agent that dispatched you. You never stub and never settle an open
  question by a choice of your own; you only report. Record each open
  question in `gaps` as `{"id": "gap-<n>", "class", "question"}`, with class
  `cosmetic`, `internal`, `behaviour`, `data`, `security`, `public_api` or
  `cost`, and leave `stub` and `location` out. Any gap makes the result
  `BLOCKED` with `blocked.class: decision`. `assumptions` must be empty for
  `DONE`; otherwise each entry starts with its gap id, e.g. `gap-1: assumed
  the route is internal`.

  Load the `security-audit` skill and follow it. It runs the scanners,
  walks the review checklist and defines the severity rubric.

  Final response. End with exactly one fenced ```json block, the last one in
  the message, holding the result: `status` (`DONE`, `DONE_WITH_CONCERNS` or
  `BLOCKED`), `verdict` (`pass` or `fail`), `findings`, `gaps` and
  `assumptions`, plus `blocked` when BLOCKED. Each finding carries `id`, `severity`, `file`, `line`,
  `title`, `evidence` and `fix`. `verdict` is `fail` exactly when a finding
  is `critical` or `high`. A response policy validates this block; an
  invalid final block is replaced by a denial and is not retried, so check
  the exact final text with `result_check`'s `validate_result` (kind
  `security`) before you send it.

async: false
timers: false

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

tools:
  result_check:
    type: mcp
    command: /opt/venv/bin/python3
    args: ["-I", "-m", "agent_stack_policies.mcp"]

guardrails:
  ask_timeout: 300
  policies:
    no_secret_reads:
      type: function
      function:
        # Best-effort guardrail; no read-only review token is minted yet (Plan 2 Task 11b).
        path: agent_stack_policies.secret_files.no_secret_reads
        arguments:
          secret_dir: /agent-secrets
          token_file: /agent-secrets/github/review
    read_only_os:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
        arguments: {}
    blast_radius:
      type: function
      function:
        path: agent_stack_policies.unattended.deny_on_ask
        arguments:
          handler: omnigent.policies.builtins.orchestration.blast_radius
          arguments:
            gate_pushes: true
            risky_action: DENY
    github_readonly:
      type: function
      function:
        path: agent_stack_policies.unattended.deny_on_ask
        arguments:
          handler: omnigent.policies.builtins.github.github_policy
          join_list_commands: true
          arguments:
            read_all: true
            write_repos: []
    no_write_tools:
      type: function
      function:
        # read_only_os misses Codex's apply_patch, and spawn: false its spawn_agent.
        path: agent_stack_policies.tools.deny_tools
        arguments:
          patterns:
            - apply_patch
            - "*spawn_agent"
            - "*linear_app*"
            - "*__linear-*"
            - "*save_*"
            - "*delete_*"
            - "*manage_adr"
            - "*ingest_traces"
    no_policy_tools:
      type: function
      function:
        # Omnigent 0.19.1 has no switch to unregister the always-on policy tools.
        path: agent_stack_policies.tools.deny_tools
        arguments:
          patterns: [sys_add_policy, sys_policy_registry]
    max_tool_calls_per_session:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 300
    detect_loop:
      type: function
      function:
        path: agent_stack_policies.loop.detect_loop
        arguments: {}
    result_contract:
      type: function
      function:
        path: agent_stack_policies.result.result_contract
        arguments:
          kind: security
