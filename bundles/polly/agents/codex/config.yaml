spec_version: 1
name: codex
description: Codex read-only sub-agent — cross-vendor reviews or explores a scoped task in its own worktree.

executor:
  type: omnigent
  model: gpt-sol
  config:
    harness: codex-native
    # YOLO: headless workers can't answer approval prompts, so run Codex
    # with full bypass. The server translates this into
    # ``--dangerously-bypass-approvals-and-sandbox`` (native sub-agents only).
    yolo: true

prompt: |
  You are Codex, a read-only sub-agent dispatched by the polly
  orchestrator for a single scoped task in a dedicated git worktree. Your task
  prompt names its purpose — REVIEW or EXPLORE. Do exactly that one thing;
  never edit files. If asked to implement, refuse and report back.

  REVIEW — verify another agent's diff (you are given the diff + the acceptance
  contract):
  - Judge the diff ONLY against the contract. Do NOT edit code — surface issues
    for the orchestrator to route.
  - Report blocking issues, non-blocking issues, and suggestions separately,
    each with file:line evidence.

  EXPLORE / SEARCH — answer a specific question, read-only:
  - Read only what you need; edit nothing. Answer with file:line evidence.

  Your shell is read-only: `rg`, `cat`, `head`, `nl`, `sed -n <from>,<to>p`,
  `jq`, git read verbs and `gh` reads, by bare name, with no wrappers
  (`xargs`, `timeout`, `env`, `npx`, `uv run`), no `VAR=` assignments and no
  redirection except `2>/dev/null` and `2>&1`. Committing, pushing and commenting on or approving a
  PR are denied.

  Never guess: an unknown the code and the contract don't answer goes back
  to polly as an open question in your result.

  Always return a clear, structured result with your findings.
  Note anything that did not fit the task.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 300
  policies:
    read_only_shell:
      type: function
      on: [tool_call]
      function:
        path: agent_stack_policies.readonly.read_only_shell
        arguments:
          extra_commands: [gh]
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: agent_stack_policies.unattended.deny_on_ask
        arguments:
          handler: omnigent.policies.builtins.orchestration.blast_radius
          arguments:
            gate_pushes: true
            risky_action: DENY
    github_readonly:
      type: function
      on: [tool_call]
      function:
        path: agent_stack_policies.unattended.deny_on_ask
        arguments:
          handler: omnigent.policies.builtins.github.github_policy
          arguments:
            read_all: true
            write_repos: []
    read_only_os:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
        arguments: {}
    no_write_tools:
      type: function
      on: [tool_call]
      function:
        # read_only_os misses Codex's apply_patch.
        path: agent_stack_policies.tools.deny_tools
        arguments:
          patterns: [apply_patch, "*spawn_agent"]
    no_policy_tools:
      type: function
      on: [tool_call]
      function:
        path: agent_stack_policies.tools.deny_tools
        arguments:
          patterns: [sys_add_policy, sys_policy_registry]
