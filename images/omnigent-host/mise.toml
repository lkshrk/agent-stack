[tools]
go = "1.27.3"
rust = { version = "1.99.1", profile = "minimal", components = "clippy,rustfmt,rust-src" }
bun = "1.4.4"
pnpm = "12.15.0"
uv = "0.13.5"
java = "temurin-21"
kotlin = "2.4.21"
gradle = "9.8.2"
swift = "6.4.1"
lua-language-server = "3.19.2"
rust-analyzer = "2026-10-19"
golangci-lint = "2.15.0"
ruff = "0.17.3"
stylua = "2.6.0"
shellcheck = "0.11.0"
kubectl = "1.37.1"
flux2 = "2.9.6"
helm = "4.3.1"
kustomize = "5.8.3"
sops = "3.13.3"
yq = "4.54.1"
ripgrep = "15.2.0"
gitleaks = "8.30.1"
"go:golang.org/x/tools/gopls" = "0.24.0"
"npm:pyright" = "1.1.414"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.2"
# svelte@4.2.20 is an official 4.x backport published without provenance after 5.0.0 introduced it.
"npm:svelte-language-server" = { version = "0.18.5", trust_policy_excludes = ["svelte@4.2.20"] }
"npm:bash-language-server" = "5.8.1"
"npm:yaml-language-server" = "2.0.0"
"pipx:obsidian-wiki" = "2026.10.3"

[settings]
experimental = true
# The sandbox user cannot write /opt/mise; without this a project pinning a missing node breaks every node CLI.
auto_install = false
