approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
unified_exec = false
shell_snapshot = false
multi_agent = false

[shell_environment_policy]
ignore_default_excludes = false
exclude = ["*_KEY", "*_TOKEN", "*_SECRET", "LITELLM_*", "GH_*", "GITHUB_TOKEN"]

[shell_environment_policy.set]
XDG_CACHE_HOME = "/tmp/cache"
XDG_DATA_HOME = "/tmp/data"
XDG_STATE_HOME = "/tmp/state"
UV_CACHE_DIR = "/tmp/cache/uv"
npm_config_cache = "/tmp/cache/npm"
SEMGREP_SETTINGS_FILE = "/tmp/cache/semgrep/settings.yml"
SEMGREP_LOG_FILE = "/tmp/cache/semgrep/semgrep.log"
SEMGREP_VERSION_CACHE_PATH = "/tmp/cache/semgrep/versions"
MISE_DATA_DIR = "/opt/mise"
MISE_CONFIG_DIR = "/etc/mise"
MISE_GLOBAL_CONFIG_FILE = "/etc/mise/config.toml"
MISE_CACHE_DIR = "/tmp/mise-cache"
MISE_YES = "1"
